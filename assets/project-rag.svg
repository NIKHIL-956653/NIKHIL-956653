<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384" role="img" aria-label="Enterprise RAG Pipeline, drawn as a retrieval funnel: a query is expanded into variants, searched by BM25 and dense vectors in parallel, merged by reciprocal rank fusion, reranked by a cross-encoder from top-50 to top-5, expanded to parent chunks and answered with citations. About 6,800 pages and 20,000 chunks, fully local.">
<defs>
<linearGradient id="pjrag-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2238"/><stop offset="1" stop-color="#06172A"/></linearGradient>
<pattern id="pjrag-g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 V20 M0 20 H20" stroke="#123A5E" stroke-width=".5" opacity=".55"/></pattern>
<pattern id="pjrag-g2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0 V100 M0 100 H100" stroke="#1B4E79" stroke-width=".7" opacity=".5"/></pattern>
<linearGradient id="pjrag-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.pjrag-m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.pjrag-s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.pjrag-i{animation:pjrag-i .9s cubic-bezier(.16,1,.3,1) both}
.pjrag-d1{animation-delay:.1s}.pjrag-d2{animation-delay:.2s}.pjrag-d3{animation-delay:.3s}.pjrag-d4{animation-delay:.4s}.pjrag-d5{animation-delay:.5s}.pjrag-d6{animation-delay:.6s}
.pjrag-dr{stroke-dasharray:1200;animation:pjrag-dr 1.8s cubic-bezier(.65,0,.35,1) .3s both}
.pjrag-band{animation:pjrag-band 8s cubic-bezier(.4,0,.6,1) 1.6s infinite}
@keyframes pjrag-i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pjrag-dr{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes pjrag-band{0%{transform:translateX(0)}45%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){.pjrag-i,.pjrag-dr,.pjrag-band{animation:none}}
</style>
<rect width="1200" height="384" fill="url(#pjrag-bg)"/>
<rect width="1200" height="384" fill="url(#pjrag-g1)"/>
<rect width="1200" height="384" fill="url(#pjrag-g2)"/>
<rect x="8.5" y="8.5" width="1183" height="367" fill="none" stroke="#1B4E79"/>
<rect x="14.5" y="14.5" width="1171" height="355" fill="none" stroke="#123A5E" stroke-width=".6"/>
<g class="pjrag-i"><text class="pjrag-m" x="44" y="50" font-size="11" letter-spacing="3" fill="#5EEAD4" text-anchor="start">FIG. 04 — HYBRID RETRIEVAL PIPELINE</text><text class="pjrag-m" x="1156" y="50" font-size="10.5" letter-spacing="2" fill="#5E809F" text-anchor="end">SCALE 1:1 · REV 2026.10</text></g>
<g class="pjrag-i pjrag-d1"><text class="pjrag-s" x="44" y="90" font-size="30" fill="#DCEAF8" text-anchor="start" font-weight="300">Enterprise RAG Pipeline</text><text class="pjrag-m" x="1156" y="90" font-size="11" letter-spacing="1" fill="#86A9CB" text-anchor="end">github.com/rag-curriculum</text></g>
<g class="pjrag-i pjrag-d3"><rect x="60" y="160" width="124" height="54" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjrag-s" x="122" y="185" font-size="12.5" fill="#DCEAF8" text-anchor="middle">query</text><text class="pjrag-m" x="122" y="201" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">user question</text><path class="pjrag-dr" d="M188 187 H248" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M241 183 L248 187 L241 191" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="252" y="160" width="140" height="54" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjrag-s" x="322" y="185" font-size="12.5" fill="#DCEAF8" text-anchor="middle">multi-query</text><text class="pjrag-m" x="322" y="201" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">variants</text><rect x="452" y="116" width="150" height="46" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjrag-s" x="527" y="137" font-size="12.5" fill="#DCEAF8" text-anchor="middle">BM25</text><text class="pjrag-m" x="527" y="153" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">sparse</text><rect x="452" y="212" width="150" height="46" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjrag-s" x="527" y="233" font-size="12.5" fill="#DCEAF8" text-anchor="middle">dense</text><text class="pjrag-m" x="527" y="249" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">nomic-embed</text><path d="M396 187 h28 v-21 h24 M424 187 v48 h24" stroke="#5EEAD4" stroke-width="1" opacity=".85" fill="none"/><rect x="650" y="160" width="130" height="54" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjrag-s" x="715" y="185" font-size="12.5" fill="#DCEAF8" text-anchor="middle">RRF merge</text><text class="pjrag-m" x="715" y="201" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">top-50</text><path d="M602 139 h24 v48 h20 M602 235 h24 v-48" stroke="#5EEAD4" stroke-width="1" opacity=".85" fill="none"/><path class="pjrag-dr" d="M784 187 H840" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M833 183 L840 187 L833 191" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="844" y="160" width="140" height="54" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjrag-s" x="914" y="185" font-size="12.5" fill="#DCEAF8" text-anchor="middle">rerank</text><text class="pjrag-m" x="914" y="201" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">cross-encoder</text><path class="pjrag-dr" d="M988 187 H1040" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M1033 183 L1040 187 L1033 191" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="1044" y="160" width="96" height="54" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjrag-s" x="1092" y="185" font-size="12.5" fill="#DCEAF8" text-anchor="middle">top-5</text><text class="pjrag-m" x="1092" y="201" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">cited</text><circle cx="715" cy="136" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjrag-m" x="715" y="140.5" text-anchor="middle" font-size="12" fill="#5EEAD4">1</text><circle cx="914" cy="238" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjrag-m" x="914" y="242.5" text-anchor="middle" font-size="12" fill="#5EEAD4">2</text><text class="pjrag-m" x="60" y="280" font-size="10" letter-spacing="1" fill="#86A9CB" text-anchor="start">parent-child chunking · contextual retrieval · per-chunk ACL · RAGAS eval</text></g>
<g class="pjrag-i pjrag-d5"><path d="M60 306 H1140" stroke="#1B4E79" stroke-width=".7"/><text class="pjrag-m" x="60" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(1)</text><text class="pjrag-s" x="86" y="330" font-size="12" fill="#86A9CB" text-anchor="start">BM25 and dense results are merged by reciprocal rank fusion</text><text class="pjrag-m" x="600" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(2)</text><text class="pjrag-s" x="626" y="330" font-size="12" fill="#86A9CB" text-anchor="start">fully local — no external API in the retrieval path</text><text class="pjrag-m" x="44" y="356" font-size="11" letter-spacing="1" fill="#DCEAF8" text-anchor="start">~6,800 pages · ~20K chunks · 50 → 5 rerank</text><text class="pjrag-m" x="1156" y="356" font-size="11" letter-spacing="1" fill="#5E809F" text-anchor="end">qdrant · ollama · nomic-embed · bge reranker · ragas · streamlit</text></g>
</svg>