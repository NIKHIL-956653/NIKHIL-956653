<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Enterprise Agent Platform: multi-tenant AI agents as a service with Postgres RLS tenant isolation, ABAC clearance in the RLS predicate, hash-chained audit log, Temporal durable execution and Gemini plus Anthropic providers. 10 migrations, 4 ADRs, 160+ tests green in CI. FastAPI, SQLAlchemy 2.0, pgvector, Redis, Temporal, React.">
<defs>
<linearGradient id="pj-eap-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1527"/><stop offset="1" stop-color="#070B14"/></linearGradient>
<radialGradient id="pj-eap-glow" cx="0.72" cy="0.5" r="0.75"><stop offset="0" stop-color="#22D3EE" stop-opacity=".17"/><stop offset=".45" stop-color="#22D3EE" stop-opacity=".04"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="pj-eap-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#2B4166" opacity=".5"/></pattern>
<linearGradient id="pj-eap-rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#2B4166"/><stop offset="1" stop-color="#2B4166" stop-opacity="0"/></linearGradient>
<linearGradient id="pj-eap-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pj-eap-dot"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#67E8F9" stop-opacity=".7"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="380" rx="24" fill="url(#pj-eap-bg)"/>
<rect width="1200" height="380" rx="24" fill="url(#pj-eap-grid)"/>
<rect width="1200" height="380" rx="24" fill="url(#pj-eap-glow)"/>
<rect x=".5" y=".5" width="1199" height="379" rx="23.5" fill="none" stroke="#1E2E4A"/>
<style>
.pj-eap-serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif}.pj-eap-sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.pj-eap-mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.pj-eap-in{animation:pj-eap-in 1s cubic-bezier(.16,1,.3,1) both}
.pj-eap-d1{animation-delay:.12s}.pj-eap-d2{animation-delay:.24s}.pj-eap-d3{animation-delay:.36s}.pj-eap-d4{animation-delay:.48s}.pj-eap-d5{animation-delay:.6s}.pj-eap-d6{animation-delay:.72s}.pj-eap-d7{animation-delay:.84s}.pj-eap-d8{animation-delay:.96s}
.pj-eap-draw{stroke-dasharray:1400;animation:pj-eap-draw 1.6s cubic-bezier(.65,0,.35,1) .4s both}
@keyframes pj-eap-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pj-eap-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.pj-eap-band{animation:pj-eap-band 7s cubic-bezier(.4,0,.6,1) 1.4s infinite}
@keyframes pj-eap-band{0%{transform:translateX(0)}40%{transform:translateX(1600px)}100%{transform:translateX(1600px)}}
@media (prefers-reduced-motion:reduce){.pj-eap-in,.pj-eap-draw,.pj-eap-band{animation:none}}
.pj-eap-tick{animation:pj-eap-tick .5s ease-out both}@keyframes pj-eap-tick{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}.pj-eap-bar{transform-box:fill-box;transform-origin:center;animation:pj-eap-bar .7s cubic-bezier(.16,1,.3,1) both}@keyframes pj-eap-bar{from{transform:scaleX(0)}to{transform:none}}@media (prefers-reduced-motion:reduce){.pj-eap-tick,.pj-eap-bar{animation:none}}</style>
<path d="M28 .5 H560" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2"/>
<path d="M740 52 V330" stroke="#1E2E4A"/>
<g class="pj-eap-in"><text class="pj-eap-mono " x="56" y="62" font-size="11" letter-spacing="3" fill="#22D3EE" text-anchor="start">01 · AI PLATFORM · MULTI-TENANT · 2026</text></g>
<g class="pj-eap-in pj-eap-d1"><text class="pj-eap-serif" x="56" y="112" font-size="46" font-weight="300" letter-spacing="-1" fill="#EAF2FF">Enterprise Agent Platform</text></g>
<g class="pj-eap-in pj-eap-d2">
<text class="pj-eap-sans" x="56" y="148" font-size="17.5" fill="#93A6C4">Multi-tenant AI agents as a service — isolation, audit and</text>
<text class="pj-eap-sans" x="56" y="172" font-size="17.5" fill="#93A6C4">durable runs, not just prompts.</text>
</g>
<g class="pj-eap-in pj-eap-d3">
<text class="pj-eap-sans" x="56" y="206" font-size="13" fill="#C6F7FF"><tspan fill="#22D3EE" font-weight="600">BUILT ›</tspan> Postgres RLS tenant isolation · ABAC clearance inside the RLS predicate</text>
<text class="pj-eap-sans" x="56" y="225" font-size="13" fill="#C6F7FF">hash-chained append-only audit log · Temporal workflows · Gemini + Anthropic providers</text>
</g>
<g class="pj-eap-in pj-eap-d4">
<text class="pj-eap-serif" x="56" y="290" font-size="40" font-weight="300" letter-spacing="-1" fill="#EAF2FF">10</text>
<text class="pj-eap-sans" x="56" y="312" font-size="12.5" fill="#93A6C4">Alembic migrations</text>
<text class="pj-eap-serif" x="232" y="290" font-size="40" font-weight="300" letter-spacing="-1" fill="#EAF2FF">4</text>
<text class="pj-eap-sans" x="232" y="312" font-size="12.5" fill="#93A6C4">architecture ADRs</text>
<text class="pj-eap-serif" x="408" y="290" font-size="40" font-weight="300" letter-spacing="-1" fill="#EAF2FF">160+</text>
<text class="pj-eap-sans" x="408" y="312" font-size="12.5" fill="#93A6C4">tests, green in CI</text>
</g>
<g class="pj-eap-in pj-eap-d5">
<g><rect x="56" y="334" width="75" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-eap-sans" x="93.5" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">FastAPI</text></g>
<g><rect x="139" y="334" width="124" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-eap-sans" x="201.0" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">SQLAlchemy 2.0</text></g>
<g><rect x="271" y="334" width="82" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-eap-sans" x="312.0" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">pgvector</text></g>
<g><rect x="361" y="334" width="61" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-eap-sans" x="391.5" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">Redis</text></g>
<g><rect x="430" y="334" width="82" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-eap-sans" x="471.0" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">Temporal</text></g>
<g><rect x="520" y="334" width="61" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-eap-sans" x="550.5" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">React</text></g>
</g>
<g class="pj-eap-in pj-eap-d3"><text class="pj-eap-mono " x="800" y="78" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">ONE DATABASE · ROW-LEVEL SECURITY</text><rect x="800" y="96" width="330" height="48" rx="12" fill="#122036" stroke="#2B4166"><animate attributeName="stroke" values="#2B4166;#22D3EE;#2B4166" keyTimes="0;.5;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><rect x="800" y="108" width="3" height="24" rx="1.5" fill="#22D3EE" opacity=".9"/><text class="pj-eap-mono" x="818" y="125" font-size="13" fill="#EAF2FF">tenant · acme</text><text class="pj-eap-mono" x="1116" y="125" font-size="11" text-anchor="end" fill="#93A6C4">clearance: internal</text><rect x="1070" y="115" width="10" height="8" rx="2" fill="none" stroke="#67E8F9" opacity=".0"/><rect x="800" y="158" width="330" height="48" rx="12" fill="#122036" stroke="#2B4166"><animate attributeName="stroke" values="#2B4166;#22D3EE;#2B4166" keyTimes="0;.5;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect><rect x="800" y="170" width="3" height="24" rx="1.5" fill="#22D3EE" opacity=".9"/><text class="pj-eap-mono" x="818" y="187" font-size="13" fill="#EAF2FF">tenant · globex</text><text class="pj-eap-mono" x="1116" y="187" font-size="11" text-anchor="end" fill="#93A6C4">clearance: restricted</text><rect x="1070" y="177" width="10" height="8" rx="2" fill="none" stroke="#67E8F9" opacity=".0"/><rect x="800" y="220" width="330" height="48" rx="12" fill="#122036" stroke="#2B4166"><animate attributeName="stroke" values="#2B4166;#22D3EE;#2B4166" keyTimes="0;.5;1" dur="6s" begin="4s" repeatCount="indefinite"/></rect><rect x="800" y="232" width="3" height="24" rx="1.5" fill="#22D3EE" opacity=".9"/><text class="pj-eap-mono" x="818" y="249" font-size="13" fill="#EAF2FF">tenant · initech</text><text class="pj-eap-mono" x="1116" y="249" font-size="11" text-anchor="end" fill="#93A6C4">clearance: public</text><rect x="1070" y="239" width="10" height="8" rx="2" fill="none" stroke="#67E8F9" opacity=".0"/><text class="pj-eap-mono" x="800" y="300" font-size="11" fill="#67E8F9">WHERE tenant_id = :tenant <tspan fill="#93A6C4">AND</tspan> clearance ≤ :principal</text><text class="pj-eap-sans" x="800" y="322" font-size="12" fill="#5F7394">not cleared → never retrieved → never inside a prompt</text></g>
</svg>