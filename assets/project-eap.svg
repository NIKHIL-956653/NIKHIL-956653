<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384" role="img" aria-label="Enterprise Agent Platform, drawn as a schematic: a tenant client authenticates to a FastAPI service, requests cross a Postgres row-level-security boundary carrying tenant and clearance, and reach pgvector. Redis handles rate limits and queues; Temporal makes runs durable; Gemini and Anthropic sit behind one provider protocol. 162 tests, 10 migrations, 4 ADRs.">
<defs>
<linearGradient id="pjeap-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2238"/><stop offset="1" stop-color="#06172A"/></linearGradient>
<pattern id="pjeap-g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 V20 M0 20 H20" stroke="#123A5E" stroke-width=".5" opacity=".55"/></pattern>
<pattern id="pjeap-g2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0 V100 M0 100 H100" stroke="#1B4E79" stroke-width=".7" opacity=".5"/></pattern>
<linearGradient id="pjeap-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.pjeap-m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.pjeap-s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.pjeap-i{animation:pjeap-i .9s cubic-bezier(.16,1,.3,1) both}
.pjeap-d1{animation-delay:.1s}.pjeap-d2{animation-delay:.2s}.pjeap-d3{animation-delay:.3s}.pjeap-d4{animation-delay:.4s}.pjeap-d5{animation-delay:.5s}.pjeap-d6{animation-delay:.6s}
.pjeap-dr{stroke-dasharray:1200;animation:pjeap-dr 1.8s cubic-bezier(.65,0,.35,1) .3s both}
.pjeap-band{animation:pjeap-band 8s cubic-bezier(.4,0,.6,1) 1.6s infinite}
@keyframes pjeap-i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pjeap-dr{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes pjeap-band{0%{transform:translateX(0)}45%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){.pjeap-i,.pjeap-dr,.pjeap-band{animation:none}}
</style>
<rect width="1200" height="384" fill="url(#pjeap-bg)"/>
<rect width="1200" height="384" fill="url(#pjeap-g1)"/>
<rect width="1200" height="384" fill="url(#pjeap-g2)"/>
<rect x="8.5" y="8.5" width="1183" height="367" fill="none" stroke="#1B4E79"/>
<rect x="14.5" y="14.5" width="1171" height="355" fill="none" stroke="#123A5E" stroke-width=".6"/>
<g class="pjeap-i"><text class="pjeap-m" x="44" y="50" font-size="11" letter-spacing="3" fill="#5EEAD4" text-anchor="start">FIG. 01 — MULTI-TENANT AGENT PLATFORM</text><text class="pjeap-m" x="1156" y="50" font-size="10.5" letter-spacing="2" fill="#5E809F" text-anchor="end">SCALE 1:1 · REV 2026.10</text></g>
<g class="pjeap-i pjeap-d1"><text class="pjeap-s" x="44" y="90" font-size="30" fill="#DCEAF8" text-anchor="start" font-weight="300">Enterprise Agent Platform</text><text class="pjeap-m" x="1156" y="90" font-size="11" letter-spacing="1" fill="#86A9CB" text-anchor="end">github.com/enterprise-agent-platform</text></g>
<g class="pjeap-i pjeap-d3"><rect x="60" y="168" width="118" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjeap-s" x="119" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">client</text><text class="pjeap-m" x="119" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">tenant user</text><path class="pjeap-dr" d="M182 196 H246" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M239 192 L246 196 L239 200" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><text class="pjeap-m" x="214" y="187" font-size="9.5" letter-spacing="1" fill="#86A9CB" text-anchor="middle">JWT</text><rect x="250" y="168" width="132" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjeap-s" x="316" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">FastAPI</text><text class="pjeap-m" x="316" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">async API</text><path class="pjeap-dr" d="M386 196 H450" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M443 192 L450 196 L443 200" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><text class="pjeap-m" x="418" y="187" font-size="9.5" letter-spacing="1" fill="#86A9CB" text-anchor="middle">principal</text><rect x="454" y="168" width="156" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjeap-s" x="532" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">RLS boundary</text><text class="pjeap-m" x="532" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">tenant + clearance</text><path class="pjeap-dr" d="M614 196 H678" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M671 192 L678 196 L671 200" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="682" y="168" width="146" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjeap-s" x="755" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Postgres</text><text class="pjeap-m" x="755" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">pgvector</text><rect x="454" y="106" width="156" height="48" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjeap-s" x="532" y="128" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Redis</text><text class="pjeap-m" x="532" y="144" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">limits · queues</text><rect x="454" y="242" width="156" height="48" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjeap-s" x="532" y="264" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Temporal</text><text class="pjeap-m" x="532" y="280" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">durable runs</text><path d="M316 168 V130 h134" stroke="#1B4E79" stroke-width=".9" fill="none"/><path d="M316 224 V266 h134" stroke="#1B4E79" stroke-width=".9" fill="none"/><rect x="900" y="106" width="146" height="48" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjeap-s" x="973" y="128" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Gemini</text><text class="pjeap-m" x="973" y="144" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">provider</text><rect x="900" y="242" width="146" height="48" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjeap-s" x="973" y="264" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Anthropic</text><text class="pjeap-m" x="973" y="280" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">provider</text><path d="M828 196 h42 V130 h30 M870 196 V266 h30" stroke="#1B4E79" stroke-width=".9" fill="none"/><text class="pjeap-m" x="884" y="190" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="start">one protocol</text><circle cx="632" cy="152" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjeap-m" x="632" y="156.5" text-anchor="middle" font-size="12" fill="#5EEAD4">1</text><circle cx="632" cy="268" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjeap-m" x="632" y="272.5" text-anchor="middle" font-size="12" fill="#5EEAD4">2</text></g>
<g class="pjeap-i pjeap-d5"><path d="M60 306 H1140" stroke="#1B4E79" stroke-width=".7"/><text class="pjeap-m" x="60" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(1)</text><text class="pjeap-s" x="86" y="330" font-size="12" fill="#86A9CB" text-anchor="start">not cleared for a chunk → never retrieved → never in a prompt</text><text class="pjeap-m" x="600" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(2)</text><text class="pjeap-s" x="626" y="330" font-size="12" fill="#86A9CB" text-anchor="start">every run is a workflow — a crash resumes at the last step</text><text class="pjeap-m" x="44" y="356" font-size="11" letter-spacing="1" fill="#DCEAF8" text-anchor="start">162 tests · 10 migrations · 4 ADRs</text><text class="pjeap-m" x="1156" y="356" font-size="11" letter-spacing="1" fill="#5E809F" text-anchor="end">fastapi · sqlalchemy · pgvector · redis · temporal · react</text></g>
</svg>