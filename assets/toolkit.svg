.kit-i{animation:kit-i .9s cubic-bezier(.16,1,.3,1) both}
.kit-d1{animation-delay:.1s}.kit-d2{animation-delay:.2s}.kit-d3{animation-delay:.3s}.kit-d4{animation-delay:.4s}.kit-d5{animation-delay:.5s}.kit-d6{animation-delay:.6s}
.kit-dr{stroke-dasharray:1200;animation:kit-dr 1.8s cubic-bezier(.65,0,.35,1) .3s both}
.kit-band{animation:kit-band 8s cubic-bezier(.4,0,.6,1) 1.6s infinite}
@keyframes kit-i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kit-dr{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes kit-band{0%{transform:translateX(0)}45%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){.kit-i,.kit-dr,.kit-band{animation:none}}
</style>
