<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Toolkit. Languages: Python, TypeScript · SQL, Bash · PowerShell. Ai · Llm · Agents: LangGraph · agents, RAG · rerank · eval, Gemini · Claude · Ollama. Backend &amp; Apis: FastAPI · Pydantic, SQLAlchemy · Alembic, JWT · RLS · ABAC. Data &amp; Vectors: Postgres · pgvector, Qdrant · FAISS, Redis · SQLite. Devops &amp; Cloud: Docker · Compose, GitHub Actions CI, AWS · Temporal. Frontend &amp; Quality: React · Vite · TS, Streamlit, pytest · ruff · mypy.">
<defs>
<linearGradient id="kit-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1527"/><stop offset="1" stop-color="#070B14"/></linearGradient>
<radialGradient id="kit-glow" cx="0.5" cy="0.5" r="0.75"><stop offset="0" stop-color="#22D3EE" stop-opacity=".17"/><stop offset=".45" stop-color="#22D3EE" stop-opacity=".04"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="kit-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#2B4166" opacity=".5"/></pattern>
<linearGradient id="kit-rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#2B4166"/><stop offset="1" stop-color="#2B4166" stop-opacity="0"/></linearGradient>
<linearGradient id="kit-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="kit-dot"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#67E8F9" stop-opacity=".7"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="500" rx="24" fill="url(#kit-bg)"/>
<rect width="1200" height="500" rx="24" fill="url(#kit-grid)"/>
<rect width="1200" height="500" rx="24" fill="url(#kit-glow)"/>
<rect x=".5" y=".5" width="1199" height="499" rx="23.5" fill="none" stroke="#1E2E4A"/>
<style>
.kit-serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif}.kit-sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.kit-mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.kit-in{animation:kit-in 1s cubic-bezier(.16,1,.3,1) both}
.kit-d1{animation-delay:.12s}.kit-d2{animation-delay:.24s}.kit-d3{animation-delay:.36s}.kit-d4{animation-delay:.48s}.kit-d5{animation-delay:.6s}.kit-d6{animation-delay:.72s}.kit-d7{animation-delay:.84s}.kit-d8{animation-delay:.96s}
.kit-draw{stroke-dasharray:1400;animation:kit-draw 1.6s cubic-bezier(.65,0,.35,1) .4s both}
@keyframes kit-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes kit-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.kit-band{animation:kit-band 7s cubic-bezier(.4,0,.6,1) 1.4s infinite}
@keyframes kit-band{0%{transform:translateX(0)}40%{transform:translateX(1600px)}100%{transform:translateX(1600px)}}
@media (prefers-reduced-motion:reduce){.kit-in,.kit-draw,.kit-band{animation:none}}
</style>
<g class="kit-in kit-d1"><rect x="40" y="40" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M66 40.5 H376" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="kit-mono " x="68" y="76" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">01 LANGUAGES</text><text class="kit-serif" x="68" y="130" font-size="29" fill="#EAF2FF">Python</text><text class="kit-mono" x="176" y="120" font-size="9.5" letter-spacing="2" fill="#67E8F9">PRIMARY</text><text class="kit-serif" x="68" y="170" font-size="24" fill="#C6F7FF">TypeScript · SQL</text><text class="kit-serif" x="68" y="206" font-size="22" fill="#93A6C4">Bash · PowerShell</text></g>
