<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" width="1200" height="352" role="img" aria-label="Parts list. Languages: Python · TypeScript · SQL · Bash. AI / LLM: LangGraph · RAG · rerank · eval · Gemini · Claude · Ollama. Backend: FastAPI · Pydantic · SQLAlchemy · Alembic · JWT · RLS · ABAC. Data: PostgreSQL · pgvector · Qdrant · FAISS · Redis · SQLite. Platform: Docker · Compose · GitHub Actions · AWS · Temporal. Quality: pytest · ruff · mypy · coverage gates · RAGAS.">
