<g class="kit-in kit-d3"><rect x="798" y="40" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M824 40.5 H1134" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="kit-mono " x="826" y="76" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">03 BACKEND &amp; APIS</text><text class="kit-serif" x="826" y="130" font-size="29" fill="#EAF2FF">FastAPI · Pydantic</text><text class="kit-serif" x="826" y="170" font-size="24" fill="#C6F7FF">SQLAlchemy · Alembic</text><text class="kit-serif" x="826" y="206" font-size="22" fill="#93A6C4">JWT · RLS · ABAC</text></g>
<g class="kit-in kit-d4"><rect x="40" y="260" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M66 260.5 H376" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="kit-mono " x="68" y="296" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">04 DATA &amp; VECTORS</text><text class="kit-serif" x="68" y="350" font-size="29" fill="#EAF2FF">Postgres · pgvector</text><text class="kit-serif" x="68" y="390" font-size="24" fill="#C6F7FF">Qdrant · FAISS</text><text class="kit-serif" x="68" y="426" font-size="22" fill="#93A6C4">Redis · SQLite</text></g>
<g class="kit-in kit-d5"><rect x="419" y="260" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M445 260.5 H755" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="kit-mono " x="447" y="296" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">05 DEVOPS &amp; CLOUD</text><text class="kit-serif" x="447" y="350" font-size="29" fill="#EAF2FF">Docker · Compose</text><text class="kit-serif" x="447" y="390" font-size="24" fill="#C6F7FF">GitHub Actions CI</text><text class="kit-serif" x="447" y="426" font-size="22" fill="#93A6C4">AWS · Temporal</text></g>
<g class="kit-in kit-d6"><rect x="798" y="260" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M824 260.5 H1134" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="kit-mono " x="826" y="296" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">06 FRONTEND &amp; QUALITY</text><text class="kit-serif" x="826" y="350" font-size="29" fill="#EAF2FF">React · Vite · TS</text><text class="kit-serif" x="826" y="390" font-size="24" fill="#C6F7FF">Streamlit</text><text class="kit-serif" x="826" y="426" font-size="22" fill="#93A6C4">pytest · ruff · mypy</text></g>
