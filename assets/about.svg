<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" width="1200" height="376" role="img" aria-label="Specification. language: Python 3.11+ — FastAPI, SQLAlchemy 2.0 async, pytest-first. agents: LangGraph runtime, tool calling, offline eval harness. retrieval: pgvector + Qdrant, hybrid BM25 + dense, cross-encoder rerank. platform: Docker, GitHub Actions, AWS, Temporal durable execution. principle: Treat the model as untrusted — verify locally, ship with tests.">
<defs>
<linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2238"/><stop offset="1" stop-color="#06172A"/></linearGradient>
<pattern id="ab-g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 V20 M0 20 H20" stroke="#123A5E" stroke-width=".5" opacity=".55"/></pattern>
<pattern id="ab-g2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0 V100 M0 100 H100" stroke="#1B4E79" stroke-width=".7" opacity=".5"/></pattern>
<linearGradient id="ab-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.ab-m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.ab-s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.ab-i{animation:ab-i .9s cubic-bezier(.16,1,.3,1) both}
.ab-d1{animation-delay:.1s}.ab-d2{animation-delay:.2s}.ab-d3{animation-delay:.3s}.ab-d4{animation-delay:.4s}.ab-d5{animation-delay:.5s}.ab-d6{animation-delay:.6s}
.ab-dr{stroke-dasharray:1200;animation:ab-dr 1.8s cubic-bezier(.65,0,.35,1) .3s both}
.ab-band{animation:ab-band 8s cubic-bezier(.4,0,.6,1) 1.6s infinite}
@keyframes ab-i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ab-dr{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes ab-band{0%{transform:translateX(0)}45%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){.ab-i,.ab-dr,.ab-band{animation:none}}
</style>
