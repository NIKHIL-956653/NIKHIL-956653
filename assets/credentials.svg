<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Credentials: Data Analytics Specialty (AWS Certified · Amazon Web Services). Developer Associate (AWS Certified · Amazon Web Services). DevOps Post Graduate Program (Purdue University · delivered by Edureka).">
<defs>
<linearGradient id="cred-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1527"/><stop offset="1" stop-color="#070B14"/></linearGradient>
<radialGradient id="cred-glow" cx="0.5" cy="1.2" r="0.75"><stop offset="0" stop-color="#22D3EE" stop-opacity=".17"/><stop offset=".45" stop-color="#22D3EE" stop-opacity=".04"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="cred-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#2B4166" opacity=".5"/></pattern>
<linearGradient id="cred-rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#2B4166"/><stop offset="1" stop-color="#2B4166" stop-opacity="0"/></linearGradient>
<linearGradient id="cred-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="cred-dot"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#67E8F9" stop-opacity=".7"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="280" rx="24" fill="url(#cred-bg)"/>
<rect width="1200" height="280" rx="24" fill="url(#cred-grid)"/>
<rect width="1200" height="280" rx="24" fill="url(#cred-glow)"/>
<rect x=".5" y=".5" width="1199" height="279" rx="23.5" fill="none" stroke="#1E2E4A"/>
<style>
.cred-serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif}.cred-sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.cred-mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.cred-in{animation:cred-in 1s cubic-bezier(.16,1,.3,1) both}
.cred-d1{animation-delay:.12s}.cred-d2{animation-delay:.24s}.cred-d3{animation-delay:.36s}.cred-d4{animation-delay:.48s}.cred-d5{animation-delay:.6s}.cred-d6{animation-delay:.72s}.cred-d7{animation-delay:.84s}.cred-d8{animation-delay:.96s}
.cred-draw{stroke-dasharray:1400;animation:cred-draw 1.6s cubic-bezier(.65,0,.35,1) .4s both}
@keyframes cred-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cred-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.cred-band{animation:cred-band 7s cubic-bezier(.4,0,.6,1) 1.4s infinite}
@keyframes cred-band{0%{transform:translateX(0)}40%{transform:translateX(1600px)}100%{transform:translateX(1600px)}}
@media (prefers-reduced-motion:reduce){.cred-in,.cred-draw,.cred-band{animation:none}}
</style>
<g class="cred-in cred-d1"><rect x="40" y="40" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M66 40.5 H376" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="cred-mono " x="68" y="74" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">CREDENTIAL 01 · AWS</text><polygon points="375.3,60.0 375.3,80.0 358.0,90.0 340.7,80.0 340.7,60.0 358.0,50.0" fill="#122036" stroke="#22D3EE" stroke-opacity=".7"/><polygon points="367.5,64.5 367.5,75.5 358.0,81.0 348.5,75.5 348.5,64.5 358.0,59.0" fill="none" stroke="#67E8F9" stroke-opacity=".9"><animateTransform attributeName="transform" type="rotate" values="0 358 70;360 358 70" dur="18s" repeatCount="indefinite"/></polygon><circle cx="358" cy="70" r="3" fill="#67E8F9"/><text class="cred-serif" x="68" y="131" font-size="30" fill="#EAF2FF">Data Analytics</text><text class="cred-serif" x="68" y="167" font-size="24" font-style="italic" fill="#67E8F9">Specialty</text><text class="cred-sans" x="68" y="208" font-size="12.5" fill="#93A6C4">AWS Certified · Amazon Web Services</text></g>
<g class="cred-in cred-d2"><rect x="419" y="40" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M445 40.5 H755" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="cred-mono " x="447" y="74" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">CREDENTIAL 02 · AWS</text><polygon points="754.3,60.0 754.3,80.0 737.0,90.0 719.7,80.0 719.7,60.0 737.0,50.0" fill="#122036" stroke="#22D3EE" stroke-opacity=".7"/><polygon points="746.5,64.5 746.5,75.5 737.0,81.0 727.5,75.5 727.5,64.5 737.0,59.0" fill="none" stroke="#67E8F9" stroke-opacity=".9"><animateTransform attributeName="transform" type="rotate" values="0 737 70;360 737 70" dur="22s" repeatCount="indefinite"/></polygon><circle cx="737" cy="70" r="3" fill="#67E8F9"/><text class="cred-serif" x="447" y="131" font-size="30" fill="#EAF2FF">Developer</text><text class="cred-serif" x="447" y="167" font-size="24" font-style="italic" fill="#67E8F9">Associate</text><text class="cred-sans" x="447" y="208" font-size="12.5" fill="#93A6C4">AWS Certified · Amazon Web Services</text></g>
<g class="cred-in cred-d3"><rect x="798" y="40" width="362" height="200" rx="18" fill="#0E1A2E" stroke="#1E2E4A"/><path d="M824 40.5 H1134" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/><text class="cred-mono " x="826" y="74" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">CREDENTIAL 03 · PURDUE</text><polygon points="1133.3,60.0 1133.3,80.0 1116.0,90.0 1098.7,80.0 1098.7,60.0 1116.0,50.0" fill="#122036" stroke="#22D3EE" stroke-opacity=".7"/><polygon points="1125.5,64.5 1125.5,75.5 1116.0,81.0 1106.5,75.5 1106.5,64.5 1116.0,59.0" fill="none" stroke="#67E8F9" stroke-opacity=".9"><animateTransform attributeName="transform" type="rotate" values="0 1116 70;360 1116 70" dur="26s" repeatCount="indefinite"/></polygon><circle cx="1116" cy="70" r="3" fill="#67E8F9"/><text class="cred-serif" x="826" y="131" font-size="30" fill="#EAF2FF">DevOps</text><text class="cred-serif" x="826" y="167" font-size="24" font-style="italic" fill="#67E8F9">Post Graduate Program</text><text class="cred-sans" x="826" y="208" font-size="12.5" fill="#93A6C4">Purdue University · delivered by Edureka</text></g>
<path class="cred-draw" d="M40 258 H1160" stroke="url(#cred-rule)" stroke-width="1"/><circle cx="40" cy="258" r="7" fill="url(#cred-dot)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.2s" repeatCount="indefinite"/></circle>
</svg>