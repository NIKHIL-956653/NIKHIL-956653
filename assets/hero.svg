<style>
.hero-serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif}.hero-sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.hero-mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.hero-in{animation:hero-in 1s cubic-bezier(.16,1,.3,1) both}
.hero-d1{animation-delay:.12s}.hero-d2{animation-delay:.24s}.hero-d3{animation-delay:.36s}.hero-d4{animation-delay:.48s}.hero-d5{animation-delay:.6s}.hero-d6{animation-delay:.72s}.hero-d7{animation-delay:.84s}.hero-d8{animation-delay:.96s}
.hero-draw{stroke-dasharray:1400;animation:hero-draw 1.6s cubic-bezier(.65,0,.35,1) .4s both}
@keyframes hero-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes hero-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.hero-band{animation:hero-band 7s cubic-bezier(.4,0,.6,1) 1.4s infinite}
@keyframes hero-band{0%{transform:translateX(0)}40%{transform:translateX(1600px)}100%{transform:translateX(1600px)}}
@media (prefers-reduced-motion:reduce){.hero-in,.hero-draw,.hero-band{animation:none}}
.hero-blink{animation:hero-blink 1.1s steps(2,start) infinite}@keyframes hero-blink{to{visibility:hidden}}
.hero-spin{transform-origin:955px 232px;animation:hero-spin 60s linear infinite}@keyframes hero-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero-spin,.hero-blink{animation:none}}</style>
