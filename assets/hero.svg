.hero-i{animation:hero-i .9s cubic-bezier(.16,1,.3,1) both}
.hero-d1{animation-delay:.1s}.hero-d2{animation-delay:.2s}.hero-d3{animation-delay:.3s}.hero-d4{animation-delay:.4s}.hero-d5{animation-delay:.5s}.hero-d6{animation-delay:.6s}
.hero-dr{stroke-dasharray:1200;animation:hero-dr 1.8s cubic-bezier(.65,0,.35,1) .3s both}
.hero-band{animation:hero-band 8s cubic-bezier(.4,0,.6,1) 1.6s infinite}
@keyframes hero-i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hero-dr{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes hero-band{0%{transform:translateX(0)}45%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){.hero-i,.hero-dr,.hero-band{animation:none}}
</style>
