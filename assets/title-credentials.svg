<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="02 CREDENTIALS: Certified, on the record.">
<defs>
<linearGradient id="t02-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1527"/><stop offset="1" stop-color="#070B14"/></linearGradient>
<radialGradient id="t02-glow" cx="0.9" cy="0.5" r="0.75"><stop offset="0" stop-color="#22D3EE" stop-opacity=".17"/><stop offset=".45" stop-color="#22D3EE" stop-opacity=".04"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="t02-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#2B4166" opacity=".5"/></pattern>
<linearGradient id="t02-rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#2B4166"/><stop offset="1" stop-color="#2B4166" stop-opacity="0"/></linearGradient>
<linearGradient id="t02-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="t02-dot"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#67E8F9" stop-opacity=".7"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="120" rx="24" fill="url(#t02-bg)"/>
<rect width="1200" height="120" rx="24" fill="url(#t02-grid)"/>
<rect width="1200" height="120" rx="24" fill="url(#t02-glow)"/>
<rect x=".5" y=".5" width="1199" height="119" rx="23.5" fill="none" stroke="#1E2E4A"/>
<style>
.t02-serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif}.t02-sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.t02-mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.t02-in{animation:t02-in 1s cubic-bezier(.16,1,.3,1) both}
.t02-d1{animation-delay:.12s}.t02-d2{animation-delay:.24s}.t02-d3{animation-delay:.36s}.t02-d4{animation-delay:.48s}.t02-d5{animation-delay:.6s}.t02-d6{animation-delay:.72s}.t02-d7{animation-delay:.84s}.t02-d8{animation-delay:.96s}
.t02-draw{stroke-dasharray:1400;animation:t02-draw 1.6s cubic-bezier(.65,0,.35,1) .4s both}
@keyframes t02-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes t02-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.t02-band{animation:t02-band 7s cubic-bezier(.4,0,.6,1) 1.4s infinite}
@keyframes t02-band{0%{transform:translateX(0)}40%{transform:translateX(1600px)}100%{transform:translateX(1600px)}}
@media (prefers-reduced-motion:reduce){.t02-in,.t02-draw,.t02-band{animation:none}}
</style>
<g class="t02-in"><rect x="40" y="18" width="46" height="30" rx="8" fill="#122036" stroke="#2B4166"/><text class="t02-mono" x="63" y="38.5" text-anchor="middle" font-size="12" letter-spacing="1" fill="#67E8F9">02</text><text class="t02-mono " x="100" y="38" font-size="12" letter-spacing="3.4" fill="#22D3EE" text-anchor="start">CREDENTIALS</text></g>
<g class="t02-in t02-d2"><text class="t02-serif" x="40" y="88" font-size="42" font-weight="300" letter-spacing="-.5" fill="#EAF2FF">Certified, <tspan font-style="italic" fill="#67E8F9">on the record.</tspan></text><clipPath id="t02-sc4"><text class="t02-serif" x="40" y="88" font-size="42" font-weight="300" letter-spacing="-.5">Certified, <tspan font-style="italic">on the record.</tspan></text></clipPath><g clip-path="url(#t02-sc4)"><rect class="t02-band" x="-360" y="0" width="360" height="100%" fill="url(#t02-sheen)"/></g></g>
<g class="t02-in t02-d3"><text class="t02-mono " x="1160" y="38" font-size="10.5" letter-spacing="2.4" fill="#5F7394" text-anchor="end">VERIFIABLE</text></g>
<path class="t02-draw" d="M40 108 H1160" stroke="url(#t02-rule)" stroke-width="1"/><circle cx="40" cy="108" r="7" fill="url(#t02-dot)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.2s" repeatCount="indefinite"/></circle>
</svg>