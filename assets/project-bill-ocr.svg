<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384" role="img" aria-label="Medical Bill OCR, drawn as a pipeline: a scan is classified, preprocessed with OpenCV, read by Tesseract 5, extracted by Gemini, then re-verified by local arithmetic before export to Excel. Anything that fails validation is flagged NEEDS_REVIEW. 45 tests, ±$0.05 tolerance, 300 DPI.">
<defs>
<linearGradient id="pjbill-ocr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2238"/><stop offset="1" stop-color="#06172A"/></linearGradient>
<pattern id="pjbill-ocr-g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 V20 M0 20 H20" stroke="#123A5E" stroke-width=".5" opacity=".55"/></pattern>
<pattern id="pjbill-ocr-g2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0 V100 M0 100 H100" stroke="#1B4E79" stroke-width=".7" opacity=".5"/></pattern>
<linearGradient id="pjbill-ocr-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.pjbill-ocr-m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.pjbill-ocr-s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.pjbill-ocr-i{animation:pjbill-ocr-i .9s cubic-bezier(.16,1,.3,1) both}
.pjbill-ocr-d1{animation-delay:.1s}.pjbill-ocr-d2{animation-delay:.2s}.pjbill-ocr-d3{animation-delay:.3s}.pjbill-ocr-d4{animation-delay:.4s}.pjbill-ocr-d5{animation-delay:.5s}.pjbill-ocr-d6{animation-delay:.6s}
.pjbill-ocr-dr{stroke-dasharray:1200;animation:pjbill-ocr-dr 1.8s cubic-bezier(.65,0,.35,1) .3s both}
.pjbill-ocr-band{animation:pjbill-ocr-band 8s cubic-bezier(.4,0,.6,1) 1.6s infinite}
@keyframes pjbill-ocr-i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pjbill-ocr-dr{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes pjbill-ocr-band{0%{transform:translateX(0)}45%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){.pjbill-ocr-i,.pjbill-ocr-dr,.pjbill-ocr-band{animation:none}}
</style>
<rect width="1200" height="384" fill="url(#pjbill-ocr-bg)"/>
<rect width="1200" height="384" fill="url(#pjbill-ocr-g1)"/>
<rect width="1200" height="384" fill="url(#pjbill-ocr-g2)"/>
<rect x="8.5" y="8.5" width="1183" height="367" fill="none" stroke="#1B4E79"/>
<rect x="14.5" y="14.5" width="1171" height="355" fill="none" stroke="#123A5E" stroke-width=".6"/>
<g class="pjbill-ocr-i"><text class="pjbill-ocr-m" x="44" y="50" font-size="11" letter-spacing="3" fill="#5EEAD4" text-anchor="start">FIG. 03 — DOCUMENT AI / OCR PIPELINE</text><text class="pjbill-ocr-m" x="1156" y="50" font-size="10.5" letter-spacing="2" fill="#5E809F" text-anchor="end">SCALE 1:1 · REV 2026.10</text></g>
<g class="pjbill-ocr-i pjbill-ocr-d1"><text class="pjbill-ocr-s" x="44" y="90" font-size="30" fill="#DCEAF8" text-anchor="start" font-weight="300">Medical Bill OCR</text><text class="pjbill-ocr-m" x="1156" y="90" font-size="11" letter-spacing="1" fill="#86A9CB" text-anchor="end">github.com/medical-bill-ocr</text></g>
<g class="pjbill-ocr-i pjbill-ocr-d3"><rect x="60" y="156" width="123" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjbill-ocr-s" x="122" y="182" font-size="12.5" fill="#DCEAF8" text-anchor="middle">scan</text><text class="pjbill-ocr-m" x="122" y="198" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">pdf · photo</text><path class="pjbill-ocr-dr" d="M187 184 H215" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M208 180 L215 184 L208 188" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="219" y="156" width="123" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjbill-ocr-s" x="281" y="182" font-size="12.5" fill="#DCEAF8" text-anchor="middle">ingest</text><text class="pjbill-ocr-m" x="281" y="198" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">classify</text><path class="pjbill-ocr-dr" d="M347 184 H375" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M368 180 L375 184 L368 188" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="379" y="156" width="123" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjbill-ocr-s" x="441" y="182" font-size="12.5" fill="#DCEAF8" text-anchor="middle">OpenCV</text><text class="pjbill-ocr-m" x="441" y="198" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">deskew · threshold</text><path class="pjbill-ocr-dr" d="M506 184 H534" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M527 180 L534 184 L527 188" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="538" y="156" width="123" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjbill-ocr-s" x="600" y="182" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Tesseract 5</text><text class="pjbill-ocr-m" x="600" y="198" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">ocr + confidence</text><path class="pjbill-ocr-dr" d="M666 184 H694" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M687 180 L694 184 L687 188" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="698" y="156" width="123" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjbill-ocr-s" x="759" y="182" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Gemini</text><text class="pjbill-ocr-m" x="759" y="198" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">extract JSON</text><path class="pjbill-ocr-dr" d="M825 184 H853" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M846 180 L853 184 L846 188" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="857" y="156" width="123" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjbill-ocr-s" x="919" y="182" font-size="12.5" fill="#DCEAF8" text-anchor="middle">validate</text><text class="pjbill-ocr-m" x="919" y="198" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">local arithmetic</text><path class="pjbill-ocr-dr" d="M985 184 H1013" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M1006 180 L1013 184 L1006 188" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><rect x="1017" y="156" width="123" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjbill-ocr-s" x="1078" y="182" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Excel</text><text class="pjbill-ocr-m" x="1078" y="198" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">two sheets</text><path d="M919 212 v34" stroke="#FCD34D" stroke-width="1" opacity=".8"/><rect x="801" y="246" width="235" height="38" rx="4" fill="#FCD34D" fill-opacity=".1" stroke="#FCD34D" stroke-opacity=".55"/><text class="pjbill-ocr-m" x="919" y="270" font-size="12" letter-spacing="1.6" fill="#FCD34D" text-anchor="middle">NEEDS_REVIEW</text><circle cx="841.1428571428572" cy="140" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjbill-ocr-m" x="841.1428571428572" y="144.5" text-anchor="middle" font-size="12" fill="#5EEAD4">1</text><circle cx="1050.5714285714287" cy="265" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjbill-ocr-m" x="1050.5714285714287" y="269.5" text-anchor="middle" font-size="12" fill="#5EEAD4">2</text><text class="pjbill-ocr-m" x="60" y="270" font-size="10" letter-spacing="1" fill="#86A9CB" text-anchor="start">±$0.05 reconciliation · OCR confidence ≥ 65 · 8 date formats</text></g>
<g class="pjbill-ocr-i pjbill-ocr-d5"><path d="M60 306 H1140" stroke="#1B4E79" stroke-width=".7"/><text class="pjbill-ocr-m" x="60" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(1)</text><text class="pjbill-ocr-s" x="86" y="330" font-size="12" fill="#86A9CB" text-anchor="start">local arithmetic re-checks every figure the model returned</text><text class="pjbill-ocr-m" x="600" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(2)</text><text class="pjbill-ocr-s" x="626" y="330" font-size="12" fill="#86A9CB" text-anchor="start">anything unverified is flagged NEEDS_REVIEW, never guessed</text><text class="pjbill-ocr-m" x="44" y="356" font-size="11" letter-spacing="1" fill="#DCEAF8" text-anchor="start">45 tests · ±$0.05 tolerance · 300 DPI</text><text class="pjbill-ocr-m" x="1156" y="356" font-size="11" letter-spacing="1" fill="#5E809F" text-anchor="end">opencv · tesseract 5 · gemini · fastapi · pandas · pytest</text></g>
</svg>