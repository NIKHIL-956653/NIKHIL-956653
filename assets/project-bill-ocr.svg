<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Medical Bill OCR: scanned photos and PDFs become validated Excel and CSV. OpenCV preprocessing, Tesseract 5 OCR, Gemini extraction, then local arithmetic validation; uncertain rows are flagged NEEDS_REVIEW. Review web UI highlights each value on the page. 45 offline tests, ±$0.05 reconciliation tolerance, 300 DPI rasterization. OpenCV, Tesseract 5, Gemini 2.5 Flash, FastAPI, pandas, pytest.">
<defs>
<linearGradient id="pj-bill-ocr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1527"/><stop offset="1" stop-color="#070B14"/></linearGradient>
<radialGradient id="pj-bill-ocr-glow" cx="0.72" cy="0.5" r="0.75"><stop offset="0" stop-color="#22D3EE" stop-opacity=".17"/><stop offset=".45" stop-color="#22D3EE" stop-opacity=".04"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="pj-bill-ocr-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#2B4166" opacity=".5"/></pattern>
<linearGradient id="pj-bill-ocr-rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#2B4166"/><stop offset="1" stop-color="#2B4166" stop-opacity="0"/></linearGradient>
<linearGradient id="pj-bill-ocr-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pj-bill-ocr-dot"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#67E8F9" stop-opacity=".7"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="380" rx="24" fill="url(#pj-bill-ocr-bg)"/>
<rect width="1200" height="380" rx="24" fill="url(#pj-bill-ocr-grid)"/>
<rect width="1200" height="380" rx="24" fill="url(#pj-bill-ocr-glow)"/>
<rect x=".5" y=".5" width="1199" height="379" rx="23.5" fill="none" stroke="#1E2E4A"/>
<style>
.pj-bill-ocr-serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif}.pj-bill-ocr-sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.pj-bill-ocr-mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.pj-bill-ocr-in{animation:pj-bill-ocr-in 1s cubic-bezier(.16,1,.3,1) both}
.pj-bill-ocr-d1{animation-delay:.12s}.pj-bill-ocr-d2{animation-delay:.24s}.pj-bill-ocr-d3{animation-delay:.36s}.pj-bill-ocr-d4{animation-delay:.48s}.pj-bill-ocr-d5{animation-delay:.6s}.pj-bill-ocr-d6{animation-delay:.72s}.pj-bill-ocr-d7{animation-delay:.84s}.pj-bill-ocr-d8{animation-delay:.96s}
.pj-bill-ocr-draw{stroke-dasharray:1400;animation:pj-bill-ocr-draw 1.6s cubic-bezier(.65,0,.35,1) .4s both}
@keyframes pj-bill-ocr-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pj-bill-ocr-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.pj-bill-ocr-band{animation:pj-bill-ocr-band 7s cubic-bezier(.4,0,.6,1) 1.4s infinite}
@keyframes pj-bill-ocr-band{0%{transform:translateX(0)}40%{transform:translateX(1600px)}100%{transform:translateX(1600px)}}
@media (prefers-reduced-motion:reduce){.pj-bill-ocr-in,.pj-bill-ocr-draw,.pj-bill-ocr-band{animation:none}}
.pj-bill-ocr-tick{animation:pj-bill-ocr-tick .5s ease-out both}@keyframes pj-bill-ocr-tick{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}.pj-bill-ocr-bar{transform-box:fill-box;transform-origin:center;animation:pj-bill-ocr-bar .7s cubic-bezier(.16,1,.3,1) both}@keyframes pj-bill-ocr-bar{from{transform:scaleX(0)}to{transform:none}}@media (prefers-reduced-motion:reduce){.pj-bill-ocr-tick,.pj-bill-ocr-bar{animation:none}}</style>
<path d="M28 .5 H560" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2"/>
<path d="M740 52 V330" stroke="#1E2E4A"/>
<g class="pj-bill-ocr-in"><text class="pj-bill-ocr-mono " x="56" y="62" font-size="11" letter-spacing="3" fill="#22D3EE" text-anchor="start">03 · DOCUMENT AI · OCR · 2026</text></g>
<g class="pj-bill-ocr-in pj-bill-ocr-d1"><text class="pj-bill-ocr-serif" x="56" y="112" font-size="46" font-weight="300" letter-spacing="-1" fill="#EAF2FF">Medical Bill OCR</text></g>
<g class="pj-bill-ocr-in pj-bill-ocr-d2">
<text class="pj-bill-ocr-sans" x="56" y="148" font-size="17.5" fill="#93A6C4">Scanned bills → validated, review-ready Excel.</text>
<text class="pj-bill-ocr-sans" x="56" y="172" font-size="17.5" fill="#93A6C4">The LLM is treated as an untrusted component.</text>
</g>
<g class="pj-bill-ocr-in pj-bill-ocr-d3">
<text class="pj-bill-ocr-sans" x="56" y="206" font-size="13" fill="#C6F7FF"><tspan fill="#22D3EE" font-weight="600">BUILT ›</tspan> OpenCV preprocess → Tesseract 5 → Gemini extraction → local arithmetic validation</text>
<text class="pj-bill-ocr-sans" x="56" y="225" font-size="13" fill="#C6F7FF">review UI that highlights each value on the page · accuracy tracked by model and by week</text>
</g>
<g class="pj-bill-ocr-in pj-bill-ocr-d4">
<text class="pj-bill-ocr-serif" x="56" y="290" font-size="40" font-weight="300" letter-spacing="-1" fill="#EAF2FF">45</text>
<text class="pj-bill-ocr-sans" x="56" y="312" font-size="12.5" fill="#93A6C4">offline tests</text>
<text class="pj-bill-ocr-serif" x="232" y="290" font-size="40" font-weight="300" letter-spacing="-1" fill="#EAF2FF">±$0.05</text>
<text class="pj-bill-ocr-sans" x="232" y="312" font-size="12.5" fill="#93A6C4">reconciliation tolerance</text>
<text class="pj-bill-ocr-serif" x="436.0" y="290" font-size="40" font-weight="300" letter-spacing="-1" fill="#EAF2FF">300 DPI</text>
<text class="pj-bill-ocr-sans" x="436.0" y="312" font-size="12.5" fill="#93A6C4">scan rasterization</text>
</g>
<g class="pj-bill-ocr-in pj-bill-ocr-d5">
<g><rect x="56" y="334" width="68" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-bill-ocr-sans" x="90.0" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">OpenCV</text></g>
<g><rect x="132" y="334" width="103" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-bill-ocr-sans" x="183.5" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">Tesseract 5</text></g>
<g><rect x="243" y="334" width="138" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-bill-ocr-sans" x="312.0" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">Gemini 2.5 Flash</text></g>
<g><rect x="389" y="334" width="75" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-bill-ocr-sans" x="426.5" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">FastAPI</text></g>
<g><rect x="472" y="334" width="68" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-bill-ocr-sans" x="506.0" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">pandas</text></g>
<g><rect x="548" y="334" width="68" height="28" rx="14" fill="#122036" stroke="#2B4166"/><text class="pj-bill-ocr-sans" x="582.0" y="352.5" text-anchor="middle" font-size="12.5" fill="#C6F7FF">pytest</text></g>
</g>
<g class="pj-bill-ocr-in pj-bill-ocr-d3"><text class="pj-bill-ocr-mono " x="800" y="78" font-size="10.5" letter-spacing="2.6" fill="#22D3EE" text-anchor="start">TRUST MODEL · LOCAL, DETERMINISTIC</text><circle cx="812" cy="104" r="9" fill="none" stroke="#2B4166"/><path class="pj-bill-ocr-tick" style="animation-delay:1.00s" d="M807 104 L811 108 L818 100" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20"/><text class="pj-bill-ocr-mono" x="834" y="109" font-size="13" fill="#EAF2FF">line items  ==  printed total</text><text class="pj-bill-ocr-mono" x="1150" y="109" font-size="12" text-anchor="end" fill="#67E8F9">± $0.05</text><path d="M834 120 H1150" stroke="#1E2E4A"/><circle cx="812" cy="148" r="9" fill="none" stroke="#2B4166"/><path class="pj-bill-ocr-tick" style="animation-delay:1.35s" d="M807 148 L811 152 L818 144" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20"/><text class="pj-bill-ocr-mono" x="834" y="153" font-size="13" fill="#EAF2FF">OCR mean confidence</text><text class="pj-bill-ocr-mono" x="1150" y="153" font-size="12" text-anchor="end" fill="#67E8F9">≥ 65</text><path d="M834 164 H1150" stroke="#1E2E4A"/><circle cx="812" cy="192" r="9" fill="none" stroke="#2B4166"/><path class="pj-bill-ocr-tick" style="animation-delay:1.70s" d="M807 192 L811 196 L818 188" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20"/><text class="pj-bill-ocr-mono" x="834" y="197" font-size="13" fill="#EAF2FF">provider · invoice # · date</text><text class="pj-bill-ocr-mono" x="1150" y="197" font-size="12" text-anchor="end" fill="#67E8F9">present</text><path d="M834 208 H1150" stroke="#1E2E4A"/><circle cx="812" cy="236" r="9" fill="none" stroke="#2B4166"/><path class="pj-bill-ocr-tick" style="animation-delay:2.05s" d="M807 236 L811 240 L818 232" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20"/><text class="pj-bill-ocr-mono" x="834" y="241" font-size="13" fill="#EAF2FF">date parseable</text><text class="pj-bill-ocr-mono" x="1150" y="241" font-size="12" text-anchor="end" fill="#67E8F9">8 formats</text><path d="M834 252 H1150" stroke="#1E2E4A"/><rect x="800" y="266" width="352" height="36" rx="10" fill="#F4B860" fill-opacity=".1" stroke="#F4B860" stroke-opacity=".5"/><text class="pj-bill-ocr-mono" x="816" y="289" font-size="12.5" fill="#F4B860">anything unverified → <tspan font-weight="700">NEEDS_REVIEW</tspan></text><text class="pj-bill-ocr-sans" x="800" y="328" font-size="12" fill="#5F7394">one corrupt file never aborts the batch ·</text><text class="pj-bill-ocr-sans" x="800" y="345" font-size="12" fill="#5F7394">every reviewer save is kept as a revision</text></g>
</svg>