<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384" role="img" aria-label="Document Writing Assistant, drawn as a pipeline: a Jira ticket is fetched, passed to a cloud or local model, scored by an evaluation gate for faithfulness, completeness and structure, then published to Google Docs or Confluence. 368 offline tests, a 95% coverage gate in CI, 6 document templates.">
<defs>
<linearGradient id="pjdocgen-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2238"/><stop offset="1" stop-color="#06172A"/></linearGradient>
<pattern id="pjdocgen-g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 V20 M0 20 H20" stroke="#123A5E" stroke-width=".5" opacity=".55"/></pattern>
<pattern id="pjdocgen-g2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0 V100 M0 100 H100" stroke="#1B4E79" stroke-width=".7" opacity=".5"/></pattern>
<linearGradient id="pjdocgen-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.pjdocgen-m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.pjdocgen-s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.pjdocgen-i{animation:pjdocgen-i .9s cubic-bezier(.16,1,.3,1) both}
.pjdocgen-d1{animation-delay:.1s}.pjdocgen-d2{animation-delay:.2s}.pjdocgen-d3{animation-delay:.3s}.pjdocgen-d4{animation-delay:.4s}.pjdocgen-d5{animation-delay:.5s}.pjdocgen-d6{animation-delay:.6s}
.pjdocgen-dr{stroke-dasharray:1200;animation:pjdocgen-dr 1.8s cubic-bezier(.65,0,.35,1) .3s both}
.pjdocgen-band{animation:pjdocgen-band 8s cubic-bezier(.4,0,.6,1) 1.6s infinite}
@keyframes pjdocgen-i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pjdocgen-dr{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes pjdocgen-band{0%{transform:translateX(0)}45%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){.pjdocgen-i,.pjdocgen-dr,.pjdocgen-band{animation:none}}
</style>
<rect width="1200" height="384" fill="url(#pjdocgen-bg)"/>
<rect width="1200" height="384" fill="url(#pjdocgen-g1)"/>
<rect width="1200" height="384" fill="url(#pjdocgen-g2)"/>
<rect x="8.5" y="8.5" width="1183" height="367" fill="none" stroke="#1B4E79"/>
<rect x="14.5" y="14.5" width="1171" height="355" fill="none" stroke="#123A5E" stroke-width=".6"/>
<g class="pjdocgen-i"><text class="pjdocgen-m" x="44" y="50" font-size="11" letter-spacing="3" fill="#5EEAD4" text-anchor="start">FIG. 02 — DOCUMENT GENERATION PIPELINE</text><text class="pjdocgen-m" x="1156" y="50" font-size="10.5" letter-spacing="2" fill="#5E809F" text-anchor="end">SCALE 1:1 · REV 2026.10</text></g>
<g class="pjdocgen-i pjdocgen-d1"><text class="pjdocgen-s" x="44" y="90" font-size="30" fill="#DCEAF8" text-anchor="start" font-weight="300">Document Writing Assistant</text><text class="pjdocgen-m" x="1156" y="90" font-size="11" letter-spacing="1" fill="#86A9CB" text-anchor="end">github.com/GenAI-Document-Writing-Assistant</text></g>
<g class="pjdocgen-i pjdocgen-d3"><rect x="113" y="168" width="150" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjdocgen-s" x="188" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Jira</text><text class="pjdocgen-m" x="188" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">ticket + context</text><path class="pjdocgen-dr" d="M267 196 H295" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M288 192 L295 196 L288 200" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><text class="pjdocgen-m" x="281" y="187" font-size="9.5" letter-spacing="1" fill="#86A9CB" text-anchor="middle">REST</text><rect x="299" y="168" width="150" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjdocgen-s" x="374" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">docgen</text><text class="pjdocgen-m" x="374" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">fetch · prompt</text><path class="pjdocgen-dr" d="M453 196 H481" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M474 192 L481 196 L474 200" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><text class="pjdocgen-m" x="467" y="187" font-size="9.5" letter-spacing="1" fill="#86A9CB" text-anchor="middle">prompt</text><rect x="485" y="168" width="150" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjdocgen-s" x="560" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">LLM</text><text class="pjdocgen-m" x="560" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">cloud or local</text><path class="pjdocgen-dr" d="M639 196 H667" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M660 192 L667 196 L660 200" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><text class="pjdocgen-m" x="653" y="187" font-size="9.5" letter-spacing="1" fill="#86A9CB" text-anchor="middle">draft</text><rect x="671" y="168" width="150" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#5EEAD4" stroke-width="1.3"/><text class="pjdocgen-s" x="746" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">eval gate</text><text class="pjdocgen-m" x="746" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">scored in CI</text><path class="pjdocgen-dr" d="M825 196 H853" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><path d="M846 192 L853 196 L846 200" fill="none" stroke="#5EEAD4" stroke-width="1" opacity=".85"/><text class="pjdocgen-m" x="839" y="187" font-size="9.5" letter-spacing="1" fill="#86A9CB" text-anchor="middle">pass</text><rect x="857" y="168" width="150" height="56" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjdocgen-s" x="932" y="194" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Google Docs</text><text class="pjdocgen-m" x="932" y="210" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">or Confluence</text><rect x="408" y="106" width="144" height="46" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjdocgen-s" x="480" y="127" font-size="12.5" fill="#DCEAF8" text-anchor="middle">OpenRouter</text><text class="pjdocgen-m" x="480" y="143" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">gemini</text><rect x="568" y="106" width="144" height="46" rx="3" fill="#06172A" fill-opacity=".62" stroke="#1B4E79" stroke-width="0.9"/><text class="pjdocgen-s" x="640" y="127" font-size="12.5" fill="#DCEAF8" text-anchor="middle">Ollama</text><text class="pjdocgen-m" x="640" y="143" font-size="9.5" letter-spacing="1" fill="#5E809F" text-anchor="middle">fully local</text><path d="M480 152 V142 H640 V152 M560 142 V168" stroke="#1B4E79" stroke-width=".9" fill="none"/><text class="pjdocgen-m" x="746" y="248" font-size="9.5" letter-spacing="1" fill="#86A9CB" text-anchor="middle">faithfulness · completeness · structure</text><circle cx="837.0" cy="152" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjdocgen-m" x="837.0" y="156.5" text-anchor="middle" font-size="12" fill="#5EEAD4">1</text><circle cx="1023.0" cy="196" r="11" fill="#06172A" stroke="#5EEAD4" stroke-width="1.2"/><text class="pjdocgen-m" x="1023.0" y="200.5" text-anchor="middle" font-size="12" fill="#5EEAD4">2</text><path d="M1007 224 V268 H299 V224" stroke="#5EEAD4" stroke-width=".9" stroke-dasharray="4 4" opacity=".6" fill="none"/><text class="pjdocgen-m" x="653" y="282" font-size="9.5" letter-spacing="1" fill="#5EEAD4" text-anchor="middle">re-run → updates the same document in place</text></g>
<g class="pjdocgen-i pjdocgen-d5"><path d="M60 306 H1140" stroke="#1B4E79" stroke-width=".7"/><text class="pjdocgen-m" x="60" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(1)</text><text class="pjdocgen-s" x="86" y="330" font-size="12" fill="#86A9CB" text-anchor="start">the eval gate scores faithfulness against the ticket</text><text class="pjdocgen-m" x="600" y="330" font-size="10.5" letter-spacing="1" fill="#5EEAD4" text-anchor="start">(2)</text><text class="pjdocgen-s" x="626" y="330" font-size="12" fill="#86A9CB" text-anchor="start">a re-run updates the same document in place, with a diff</text><text class="pjdocgen-m" x="44" y="356" font-size="11" letter-spacing="1" fill="#DCEAF8" text-anchor="start">368 tests · 95% coverage gate · 6 templates</text><text class="pjdocgen-m" x="1156" y="356" font-size="11" letter-spacing="1" fill="#5E809F" text-anchor="end">python · fastapi · jira rest · google docs · ollama · docker</text></g>
</svg>